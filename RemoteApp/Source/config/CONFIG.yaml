# Knob layout configuration.
# pos is [x, y] in pixels, relative to the primary window's content area.
# min/max/default define the knob's range (negative ranges are allowed).
# color / indicator_color are optional [r, g, b] or [r, g, b, a] (0-255) lists -
# color tints the knob face/track, indicator_color tints the pointer/grab handle.
# Omit either field to use the default theme.
font: "assets/EnterCommand.ttf"
app_version: "1.0"
num_channels: 16
num_inserts: 16
insert_dropdown_pos: [45, 450]
group_label_size: 30
knob_label_size: 12
button_label_size: 14
state_file_extension: ".dgl"
# How long to wait for a "$ack ..." reply from the STM32 before resending, in milliseconds.
# Only used while a .dgl save file is being loaded and its commands are streamed to the device.
ack_timeout_ms: 100
# Debug aid for testing without a real STM32 attached: prints every sent message to the
# console in green, uses a 200ms/5-retry ack check that logs "no ack" in red on timeout,
# and (unlike normal operation) keeps sending the rest of the .dgl load sequence afterward
# instead of stopping and showing the no-connection popup.
debug_no_serial_timeout: false
logo_text: "DIGILOG REMOTE"
logo_pos: [230, 630]
logo_size: 50

# Theme colors (Dark and Light modes)
selected_window_top_bar_color: [130, 80, 220, 255]
selected_window_top_bar_light_color: [255, 155, 216, 255]

button_color: [70, 70, 90, 255]
button_light_color: [200, 200, 215, 255]

knob_color: [120, 120, 120, 255]
knob_light_color: [200, 200, 210, 255]

textbox_color: [30, 30, 40, 255]
textbox_light_color: [240, 240, 245, 255]

