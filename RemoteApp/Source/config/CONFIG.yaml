# vertical linear slider ("fader"), placed to the right of the groups
fader:
  tag: fader
  ctrl_id: 26
  label: ""
  pos: [645, 285]
  width: 30
  height: 260
  min: 0.0
  max: 100.0
  default: 80.0
  color: [70, 70, 90, 255]
  indicator_color: [120, 180, 255, 255]

# vertical divider lines - pos is [x, y] top of the bar, length is in pixels
vertical_bars:
  - pos: [155, 45]
    length: 500
    thickness: 2
    color: [90, 90, 90, 255]
  - pos: [295, 45]
    length: 500
    thickness: 2
    color: [90, 90, 90, 255]
  - pos: [435, 45]
    length: 500
